server:
  port: ${PORT:8080}

spring:
  application:
    name: cherrycake-backend
  jackson:
    deserialization:
      accept-float-as-int: false
  profiles:
    default: dev
  datasource:
    url: ${SPRING_DATASOURCE_URL:${DATABASE_URL:${DB_URL:jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:cherry_cake}}}}
    username: ${SPRING_DATASOURCE_USERNAME:${DB_USER:${PGUSER:postgres}}}
    password: ${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:${PGPASSWORD:dashwood}}}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration
    # V3 (catalog seed) can reach master before V2 (orders); this lets V2 still run on databases that already have V3.
    out-of-order: true
    validate-on-migrate: false

springdoc:
  paths-to-match: /api/regions,/api/categories,/api/products,/api/products/*,/api/cart/calculate,/api/orders

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
