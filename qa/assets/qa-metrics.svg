<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 120" width="100%" height="120">
  <defs>
    <linearGradient id="qaCardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a0d22" />
      <stop offset="100%" stop-color="#1c0717" />
    </linearGradient>

    <linearGradient id="qaBorderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e63960" stop-opacity="0.8">
        <animate attributeName="stop-color" values="#e63960;#ff758f;#e63960" dur="6s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#3d122b" stop-opacity="0.6" />
    </linearGradient>

    <filter id="qaMGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    @keyframes dotGlow {
      0%, 100% { opacity: 0.6; }
      50% { opacity: 1; filter: drop-shadow(0 0 4px #ff758f); }
    }
    .pulse-dot { animation: dotGlow 2.5s ease-in-out infinite; }
    .val-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 28px;
      font-weight: 800;
      letter-spacing: -0.5px;
    }
    .lbl-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 11px;
      font-weight: 500;
      fill: #c7a3b3;
    }
  </style>

  <!-- CARD 1: 24 Requests (X: 0, Width: 235) -->
  <g>
    <rect x="0" y="2" width="235" height="114" rx="14" fill="url(#qaCardBg)" stroke="url(#qaBorderGrad)" stroke-width="1.2" />
    <text x="20" y="44" fill="#ffffff" class="val-text">24</text>
    <text x="62" y="44" fill="#ff758f" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="700">Requests</text>
    <text x="20" y="74" class="lbl-text">7 functional test modules covering</text>
    <text x="20" y="92" class="lbl-text">Auth, Catalog, Cart, Orders &amp; Reports</text>
    <circle cx="210" cy="24" r="4" fill="#e63960" class="pulse-dot" />
  </g>

  <!-- CARD 2: 100% Passing (X: 255, Width: 235) -->
  <g>
    <rect x="255" y="2" width="235" height="114" rx="14" fill="url(#qaCardBg)" stroke="url(#qaBorderGrad)" stroke-width="1.2" />
    <text x="275" y="44" fill="#ffffff" class="val-text">100%</text>
    <text x="365" y="44" fill="#38c172" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="700">Passing</text>
    <text x="275" y="74" class="lbl-text">Zero assertion errors across all</text>
    <text x="275" y="92" class="lbl-text">16 country test vectors in Postman</text>
    <circle cx="465" cy="24" r="4" fill="#38c172" class="pulse-dot" />
  </g>

  <!-- CARD 3: 16 Regions (X: 510, Width: 235) -->
  <g>
    <rect x="510" y="2" width="235" height="114" rx="14" fill="url(#qaCardBg)" stroke="url(#qaBorderGrad)" stroke-width="1.2" />
    <text x="530" y="44" fill="#ffffff" class="val-text">16</text>
    <text x="572" y="44" fill="#e5b061" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="700">Regions</text>
    <text x="530" y="74" class="lbl-text">Tax rates from 8% to 25.5%</text>
    <text x="530" y="92" class="lbl-text">BigDecimal HALF_UP verified</text>
    <circle cx="720" cy="24" r="4" fill="#e5b061" class="pulse-dot" />
  </g>

  <!-- CARD 4: AA WCAG 2.1 (X: 765, Width: 235) -->
  <g>
    <rect x="765" y="2" width="235" height="114" rx="14" fill="url(#qaCardBg)" stroke="url(#qaBorderGrad)" stroke-width="1.2" />
    <text x="785" y="44" fill="#ffffff" class="val-text">AA</text>
    <text x="830" y="44" fill="#38bdf8" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="700">WCAG 2.1</text>
    <text x="785" y="74" class="lbl-text">0 axe critical violations, 4.5:1 contrast</text>
    <text x="785" y="92" class="lbl-text">Lighthouse Accessibility 98/100</text>
    <circle cx="975" cy="24" r="4" fill="#38bdf8" class="pulse-dot" />
  </g>
</svg>
