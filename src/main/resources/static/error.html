<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notice | Cherry Cake Bakery &amp; Café</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;1,400&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Parisienne&family=JetBrains+Mono:wght@400;500&display=swap"
        rel="stylesheet">
    <link rel="icon" type="image/png" href="/assets/images/Flower%20Icon%20Large/TransparentSakuraFlower.png">

    <style>
        :root
        {
            --cherry-void: #12060e;
            --cherry-panel: #230b1c;
            --cherry-card: #2d0e24;
            --cherry-border: rgba(255, 183, 197, 0.18);
            --raspberry-coulis: #e63960;
            --raspberry-bright: #ff3864;
            --sakura-pink: #ffb7c5;
            --cheesecake-cream: #fff6ed;
            --text-main: #fdf2f5;
            --text-dim: #c7a3b3;
            --text-faint: #805f6e;
        }

        *
        {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body 
        {
            background-color: var(--cherry-void);
            color: var(--text-main);
            font-family: 'Plus Jakarta Sans', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
            text-align: center;
            padding: 24px;
        }

        #sakura-canvas
        {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .ambient-glow
        {
            position: absolute;
            width: 500px;
            height: 500px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(230, 57, 96, 0.22) 0%, rgba(255, 183, 197, 0.08) 50%, transparent 70%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 0;
            pointer-events: none;
        }

        .error-container
        {
            position: relative;
            z-index: 2;
            max-width: 600px;
            background: rgba(35, 11, 28, 0.85);
            border: 1px solid var(--cherry-border);
            border-radius: 28px;
            padding: 56px 40px;
            box-shadow: 0 20px 60px -10px rgba(0, 0, 0, 0.7), 0 0 50px rgba(230, 57, 96, 0.15);
            backdrop-filter: blur(14px);
        }

        .emblem-wrap
        {
            width: 90px;
            height: 90px;
            margin: 0 auto 16px auto;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .emblem-wrap img
        {
            width: 70px;
            height: 70px;
            object-fit: contain;
            filter: drop-shadow(0 4px 12px rgba(230, 57, 96, 0.4));
        }

        .error-code
        {
            font-family: 'Playfair Display', serif;
            font-size: clamp(3.5rem, 9vw, 5.5rem);
            line-height: 1;
            font-weight: 700;
            color: var(--cheesecake-cream);
            text-shadow: 0 6px 30px rgba(230, 57, 96, 0.5);
            margin-bottom: 6px;
        }

        .error-script
        {
            font-family: 'Parisienne', cursive;
            font-size: clamp(1.8rem, 4vw, 2.5rem);
            color: var(--sakura-pink);
            display: block;
            margin-bottom: 18px;
        }

        .error-message
        {
            font-size: 1.05rem;
            color: var(--text-dim);
            line-height: 1.6;
            margin-bottom: 36px;
        }

        .btn
        {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 12px 26px;
            border-radius: 9999px;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.25s ease;
            text-decoration: none;
            background: linear-gradient(135deg, var(--raspberry-coulis), var(--raspberry-bright));
            color: #fff;
            box-shadow: 0 4px 20px rgba(230, 57, 96, 0.4);
        }

        .btn:hover
        {
            transform: translateY(-2px);
            box-shadow: 0 6px 28px rgba(230, 57, 96, 0.6);
            color: #fff;
        }

        .error-footer
        {
            margin-top: 28px;
            font-size: 0.8rem;
            color: var(--text-faint);
            font-family: 'JetBrains Mono', monospace;
        }
    </style>
</head>

<body>
    <div class="ambient-glow"></div>
    <canvas id="sakura-canvas"></canvas>

    <div class="error-container">
        <div class="emblem-wrap">
            <img src="/assets/images/Flower%20Icon%20Large/TransparentSakuraFlower.png" alt="Cherry Blossom Logo">
        </div>

        <div class="error-code" id="errCode">Notice</div>
        <span class="error-script">Cherry Blossom Bakery</span>

        <p class="error-message" id="errDesc">
            An unforeseen event occurred while processing your request. Please return to the bakery entrance.
        </p>

        <a href="/" class="btn">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
                <polyline points="9 22 9 12 15 12 15 22" />
            </svg>
            Return to Bakery Home
        </a>

        <div class="error-footer">
            CHERRY CAKE BAKERY &bull; TEAM 9
        </div>
    </div>

    <script>
        const canvas = document.getElementById('sakura-canvas');
        const ctx = canvas.getContext('2d');
        function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
        resize(); window.addEventListener('resize', resize);
        const flowerImg1 = new Image(); flowerImg1.src = '/assets/images/Partical%20Effects/flower-particle.png';
        const flowerImg2 = new Image(); flowerImg2.src = '/assets/images/Partical%20Effects/flower-particle-soft.png';
        const flowerImgs = [flowerImg1, flowerImg2];
        const petals = [];
        const count = Math.min(45, Math.max(18, Math.floor(window.innerWidth / 30)));
        class Petal
        {
            constructor() { this.imgIndex = Math.random() > 0.45 ? 0 : 1; this.reset(true); }
            reset(initial = false)
            {
                this.x = Math.random() * canvas.width;
                this.y = initial ? Math.random() * canvas.height : -30;
                this.size = 16 + Math.random() * 18;
                this.speedY = 0.8 + Math.random() * 1.4;
                this.speedX = -0.4 + Math.random() * 1.0;
                this.osc = 0.015 + Math.random() * 0.025;
                this.angle = Math.random() * Math.PI * 2;
                this.spin = (Math.random() - 0.5) * 0.03;
                this.wobble = Math.random() * Math.PI * 2;
                this.wobbleSpeed = 0.02 + Math.random() * 0.03;
                this.opacity = 0.5 + Math.random() * 0.45;
                this.depth = 0.65 + Math.random() * 0.55;
                this.imgIndex = Math.random() > 0.45 ? 0 : 1;
            }
            update()
            {
                this.y += this.speedY; this.angle += this.spin; this.wobble += this.wobbleSpeed;
                this.x += this.speedX + Math.sin(this.y * this.osc) * 0.7;
                if (this.y > canvas.height + 35 || this.x > canvas.width + 35 || this.x < -35) this.reset(false);
            }
            draw()
            {
                const img = flowerImgs[this.imgIndex];
                if (!img.complete || img.naturalWidth === 0) return;
                ctx.save(); ctx.translate(this.x, this.y); ctx.rotate(this.angle);
                ctx.scale(this.depth * Math.cos(this.wobble) * 0.9, this.depth);
                ctx.globalAlpha = this.opacity;
                const s = this.size;
                ctx.drawImage(img, -s / 2, -s / 2, s, s);
                ctx.restore();
            }
        }
        for (let i = 0; i < count; i++) petals.push(new Petal());
        function loop()
        {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            petals.forEach(p => { p.update(); p.draw(); });
            requestAnimationFrame(loop);
        }
        loop();
    </script>
</body>
</html>
