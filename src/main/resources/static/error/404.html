<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Slice Not Found | Cherry Cake Bakery &amp; Café</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;1,400&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Parisienne&family=JetBrains+Mono:wght@400;500&display=swap"
        rel="stylesheet">
    <link rel="icon" type="image/png" href="/assets/images/Flower%20Icon%20Large/TransparentSakuraFlower.png">

    <style>
        :root
        {
            --cherry-void: #12060e;
            --cherry-deep: #190814;
            --cherry-panel: #230b1c;
            --cherry-card: #2d0e24;
            --cherry-border: rgba(255, 183, 197, 0.18);
            --cherry-border-glow: rgba(230, 57, 96, 0.45);

            --raspberry-coulis: #e63960;
            --raspberry-bright: #ff3864;

            --sakura-pink: #ffb7c5;
            --sakura-glow: #ffd5df;
            --cheesecake-cream: #fff6ed;
            --crust-gold: #e5b061;

            --text-main: #fdf2f5;
            --text-dim: #c7a3b3;
            --text-faint: #805f6e;
        }

        *
        {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body
        {
            background-color: var(--cherry-void);
            color: var(--text-main);
            font-family: 'Plus Jakarta Sans', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
            text-align: center;
            padding: 24px;
        }

        #sakura-canvas
        {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .ambient-glow
        {
            position: absolute;
            width: 500px;
            height: 500px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(230, 57, 96, 0.22) 0%, rgba(255, 183, 197, 0.08) 50%, transparent 70%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 0;
            pointer-events: none;
            animation: pulseGlow 6s ease-in-out infinite alternate;
        }

        @keyframes pulseGlow
        {
            0%
            {
                transform: translate(-50%, -50%) scale(0.9);
                opacity: 0.6;
            }

            100%
            {
                transform: translate(-50%, -50%) scale(1.15);
                opacity: 0.95;
            }
        }

        .error-container
        {
            position: relative;
            z-index: 2;
            max-width: 640px;
            background: rgba(35, 11, 28, 0.85);
            border: 1px solid var(--cherry-border);
            border-radius: 28px;
            padding: 56px 40px;
            box-shadow: 0 20px 60px -10px rgba(0, 0, 0, 0.7), 0 0 50px rgba(230, 57, 96, 0.15);
            backdrop-filter: blur(14px);
        }

        .emblem-wrap
        {
            width: 100px;
            height: 100px;
            margin: 0 auto 20px auto;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .emblem-wrap img
        {
            width: 75px;
            height: 75px;
            object-fit: contain;
            filter: drop-shadow(0 4px 12px rgba(230, 57, 96, 0.4));
            animation: floatFlower 4s ease-in-out infinite alternate;
        }

        @keyframes floatFlower
        {
            0% { transform: translateY(0) rotate(0deg); }
            100% { transform: translateY(-8px) rotate(8deg); }
        }

        .error-code
        {
            font-family: 'Playfair Display', serif;
            font-size: clamp(4.5rem, 12vw, 7.5rem);
            line-height: 1;
            font-weight: 700;
            color: var(--cheesecake-cream);
            text-shadow: 0 6px 30px rgba(230, 57, 96, 0.5);
            margin-bottom: 6px;
            letter-spacing: -0.02em;
        }

        .error-script
        {
            font-family: 'Parisienne', cursive;
            font-size: clamp(1.8rem, 4vw, 2.6rem);
            color: var(--sakura-pink);
            display: block;
            margin-bottom: 18px;
        }

        .error-message
        {
            font-size: 1.05rem;
            color: var(--text-dim);
            line-height: 1.6;
            margin-bottom: 36px;
        }

        .error-actions
        {
            display: flex;
            flex-wrap: wrap;
            gap: 14px;
            justify-content: center;
        }

        .btn
        {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 12px 24px;
            border-radius: 9999px;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.25s ease;
            text-decoration: none;
        }

        .btn-primary
        {
            background: linear-gradient(135deg, var(--raspberry-coulis), var(--raspberry-bright));
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.25);
            box-shadow: 0 4px 20px rgba(230, 57, 96, 0.4);
        }

        .btn-primary:hover
        {
            transform: translateY(-2px);
            box-shadow: 0 6px 28px rgba(230, 57, 96, 0.6);
            color: #fff;
        }

        .btn-secondary
        {
            background: rgba(45, 14, 36, 0.8);
            color: var(--cheesecake-cream);
            border: 1px solid var(--cherry-border);
        }

        .btn-secondary:hover
        {
            background: rgba(56, 19, 45, 0.95);
            border-color: var(--sakura-pink);
            transform: translateY(-2px);
        }

        .error-footer
        {
            margin-top: 28px;
            font-size: 0.8rem;
            color: var(--text-faint);
            font-family: 'JetBrains Mono', monospace;
        }

        /* Floating Audio Control */
        .audio-pill
        {
            position: absolute;
            bottom: 20px;
            right: 20px;
            z-index: 10;
            background: rgba(35, 11, 28, 0.85);
            border: 1px solid var(--cherry-border);
            border-radius: 9999px;
            padding: 8px 16px;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.8rem;
            color: var(--sakura-pink);
            backdrop-filter: blur(8px);
            cursor: pointer;
            transition: all 0.2s;
        }

        .audio-pill:hover { border-color: var(--sakura-pink); }
    </style>
</head>

<body>

    <div class="ambient-glow"></div>
    <canvas id="sakura-canvas"></canvas>

    <div class="error-container">
        <div class="emblem-wrap">
            <img src="/assets/images/Flower%20Icon%20Large/TransparentSakuraFlower.png" alt="Cherry Blossom Logo">
        </div>

        <div class="error-code">404</div>
        <span class="error-script">This slice has drifted away...</span>

        <p class="error-message">
            The pastry, page, or API route you are looking for has already been savored, or was never baked in our café
            oven.
        </p>

        <div class="error-actions">
            <a href="/" class="btn btn-primary">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
                    <polyline points="9 22 9 12 15 12 15 22" />
                </svg>
                Return to Bakery Home
            </a>
            <a href="/#swagger-section" class="btn btn-secondary">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" />
                    <polyline points="14 2 14 8 20 8" />
                    <line x1="16" y1="13" x2="8" y2="13" />
                    <line x1="16" y1="17" x2="8" y2="17" />
                    <polyline points="10 9 9 9 8 9" />
                </svg>
                API Reference
            </a>
            <button onclick="history.back()" class="btn btn-secondary">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="19" y1="12" x2="5" y2="12" />
                    <polyline points="12 19 5 12 12 5" />
                </svg>
                Go Back
            </button>
        </div>

        <div class="error-footer">
            HTTP 404 NOT_FOUND &bull; CHERRY CAKE BAKERY &bull; TEAM 9
        </div>
    </div>

    <!-- Audio Player Pill -->
    <div class="audio-pill" id="audioPill" title="Toggle Sakura Ambient Music">
        <svg id="musicIcon" width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 14.5v-9l6 4.5-6 4.5z" />
        </svg>
        <span id="audioText">Play Lofi Music</span>
    </div>

    <audio id="bgAudio" loop preload="auto">
        <source src="/assets/audio/Rio - Fly Love.m4a" type="audio/mp4">
    </audio>

    <script>
        // Sakura Falling Canvas Animation
        const canvas = document.getElementById('sakura-canvas');
        const ctx = canvas.getContext('2d');

        function resize()
        {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resize();
        window.addEventListener('resize', resize);

        const flowerImg1 = new Image(); flowerImg1.src = '/assets/images/Partical%20Effects/flower-particle.png';
        const flowerImg2 = new Image(); flowerImg2.src = '/assets/images/Partical%20Effects/flower-particle-soft.png';
        const flowerImgs = [flowerImg1, flowerImg2];
        const petals = [];
        const count = Math.min(45, Math.max(18, Math.floor(window.innerWidth / 30)));

        class Petal
        {
            constructor() { this.imgIndex = Math.random() > 0.45 ? 0 : 1; this.reset(true); }
            reset(initial = false)
            {
                this.x = Math.random() * canvas.width;
                this.y = initial ? Math.random() * canvas.height : -30;
                this.size = 16 + Math.random() * 18;
                this.speedY = 0.8 + Math.random() * 1.4;
                this.speedX = -0.4 + Math.random() * 1.0;
                this.osc = 0.015 + Math.random() * 0.025;
                this.angle = Math.random() * Math.PI * 2;
                this.spin = (Math.random() - 0.5) * 0.03;
                this.wobble = Math.random() * Math.PI * 2;
                this.wobbleSpeed = 0.02 + Math.random() * 0.03;
                this.opacity = 0.5 + Math.random() * 0.45;
                this.depth = 0.65 + Math.random() * 0.55;
                this.imgIndex = Math.random() > 0.45 ? 0 : 1;
            }
            update()
            {
                this.y += this.speedY; this.angle += this.spin; this.wobble += this.wobbleSpeed;
                this.x += this.speedX + Math.sin(this.y * this.osc) * 0.7;
                if (this.y > canvas.height + 35 || this.x > canvas.width + 35 || this.x < -35) this.reset(false);
            }
            draw()
            {
                const img = flowerImgs[this.imgIndex];
                if (!img.complete || img.naturalWidth === 0) return;
                ctx.save(); ctx.translate(this.x, this.y); ctx.rotate(this.angle);
                ctx.scale(this.depth * Math.cos(this.wobble) * 0.9, this.depth);
                ctx.globalAlpha = this.opacity;
                const s = this.size;
                ctx.drawImage(img, -s / 2, -s / 2, s, s);
                ctx.restore();
            }
        }

        for (let i = 0; i < count; i++) petals.push(new Petal());

        function loop()
        {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            petals.forEach(p => { p.update(); p.draw(); });
            requestAnimationFrame(loop);
        }
        loop();

        // Audio Toggle
        const audio = document.getElementById('bgAudio');
        const pill = document.getElementById('audioPill');
        const audioText = document.getElementById('audioText');

        pill.addEventListener('click', () =>
        {
            if (audio.paused) audio.play().then(() => { audioText.textContent = "Pause Ambience"; }).catch(() => { });
            else
            {
                audio.pause();
                audioText.textContent = "Play Sakura Lofi";
            }
        });
    </script>
</body>
</html>
