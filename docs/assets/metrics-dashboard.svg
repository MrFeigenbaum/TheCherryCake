<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 120" width="100%" height="120">
  <defs>
    <linearGradient id="cardBg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a0d22" />
      <stop offset="100%" stop-color="#1c0717" />
    </linearGradient>

    <linearGradient id="borderGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e63960" stop-opacity="0.8">
        <animate attributeName="stop-color" values="#e63960;#ff758f;#e63960" dur="6s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#3d122b" stop-opacity="0.6" />
    </linearGradient>

    <filter id="mGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    @keyframes dotGlow {
      0%, 100% { opacity: 0.6; }
      50% { opacity: 1; filter: drop-shadow(0 0 4px #ff758f); }
    }
    .pulse-dot { animation: dotGlow 2.5s ease-in-out infinite; }
    .val-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 28px;
      font-weight: 800;
      letter-spacing: -0.5px;
    }
    .lbl-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 11px;
      font-weight: 500;
      fill: #c7a3b3;
    }
  </style>

  <!-- Direct Absolute Layout (No CSS transform overrides possible) -->
  <!-- CARD 1: 16 Branches (X: 0, Width: 235) -->
  <g>
    <rect x="0" y="2" width="235" height="114" rx="14" fill="url(#cardBg1)" stroke="url(#borderGrad1)" stroke-width="1.2" />
    <text x="20" y="44" fill="#ffffff" class="val-text">16</text>
    <text x="60" y="44" fill="#ff758f" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="700">Branches</text>
    <text x="20" y="74" class="lbl-text">Operating countries across Europe</text>
    <text x="20" y="92" class="lbl-text">&amp; Asia with regional tax policies</text>
    <circle cx="210" cy="24" r="4" fill="#e63960" class="pulse-dot" />
  </g>

  <!-- CARD 2: 100% Exact (X: 255, Width: 235) -->
  <g>
    <rect x="255" y="2" width="235" height="114" rx="14" fill="url(#cardBg1)" stroke="url(#borderGrad1)" stroke-width="1.2" />
    <text x="275" y="44" fill="#ffffff" class="val-text">100%</text>
    <text x="365" y="44" fill="#38c172" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="700">Exact</text>
    <text x="275" y="74" class="lbl-text">BigDecimal precision calculations</text>
    <text x="275" y="92" class="lbl-text">RoundingMode.HALF_UP (2 dec)</text>
    <circle cx="465" cy="24" r="4" fill="#38c172" class="pulse-dot" />
  </g>

  <!-- CARD 3: 15+ APIs (X: 510, Width: 235) -->
  <g>
    <rect x="510" y="2" width="235" height="114" rx="14" fill="url(#cardBg1)" stroke="url(#borderGrad1)" stroke-width="1.2" />
    <text x="530" y="44" fill="#ffffff" class="val-text">15+</text>
    <text x="592" y="44" fill="#e5b061" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="700">APIs</text>
    <text x="530" y="74" class="lbl-text">Catalog, Cart Recalculations,</text>
    <text x="530" y="92" class="lbl-text">Orders, Bookings &amp; Sales Reports</text>
    <circle cx="720" cy="24" r="4" fill="#e5b061" class="pulse-dot" />
  </g>

  <!-- CARD 4: JWT RBAC (X: 765, Width: 235) -->
  <g>
    <rect x="765" y="2" width="235" height="114" rx="14" fill="url(#cardBg1)" stroke="url(#borderGrad1)" stroke-width="1.2" />
    <text x="785" y="44" fill="#ffffff" class="val-text">JWT</text>
    <text x="857" y="44" fill="#ff3864" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="700">RBAC</text>
    <text x="785" y="74" class="lbl-text">Stateless Spring Security 6</text>
    <text x="785" y="92" class="lbl-text">ROLE_USER &amp; ROLE_ADMIN</text>
    <circle cx="975" cy="24" r="4" fill="#ff3864" class="pulse-dot" />
  </g>
</svg>