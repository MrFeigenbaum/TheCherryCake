<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 180" width="100%" height="180">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="pipeBg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#14030f" />
      <stop offset="30%" stop-color="#24071b" />
      <stop offset="70%" stop-color="#28081e" />
      <stop offset="100%" stop-color="#14030f" />
    </linearGradient>

    <!-- Track Gradient -->
    <linearGradient id="trackGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e63960" stop-opacity="0.5" />
      <stop offset="30%" stop-color="#ff758f" stop-opacity="0.9" />
      <stop offset="70%" stop-color="#ff758f" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#e63960" stop-opacity="0.5" />
    </linearGradient>

    <!-- Active Final Node Gradient -->
    <linearGradient id="activeNode" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff4d6d" />
      <stop offset="50%" stop-color="#e63960" />
      <stop offset="100%" stop-color="#c9184a" />
    </linearGradient>

    <!-- Node Glow Filters -->
    <filter id="nodeGlow" x="-35%" y="-35%" width="170%" height="170%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="pulseGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="trackGlow" x="-20%" y="-100%" width="140%" height="300%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    @keyframes movePulse {
      0% { offset-distance: 0%; opacity: 0; }
      8% { opacity: 1; }
      92% { opacity: 1; }
      100% { offset-distance: 100%; opacity: 0; }
    }

    @keyframes pulseRing {
      0% { transform: scale(0.92); opacity: 0.85; }
      50% { transform: scale(1.18); opacity: 0.2; }
      100% { transform: scale(1.32); opacity: 0; }
    }

    @keyframes finalNodePulse {
      0%, 100% {
        transform: scale(1);
        filter: drop-shadow(0 0 10px rgba(255, 77, 109, 0.75));
      }
      50% {
        transform: scale(1.05);
        filter: drop-shadow(0 0 24px rgba(255, 117, 143, 0.98));
      }
    }

    @keyframes pipePetal {
      0% { transform: translate(0, 0) rotate(0deg); opacity: 0; }
      20% { opacity: 0.75; }
      80% { opacity: 0.75; }
      100% { transform: translate(160px, 50px) rotate(180deg); opacity: 0; }
    }

    @keyframes pipePetalRev {
      0% { transform: translate(0, 0) rotate(0deg); opacity: 0; }
      20% { opacity: 0.7; }
      80% { opacity: 0.7; }
      100% { transform: translate(140px, -45px) rotate(-160deg); opacity: 0; }
    }

    @keyframes starPulse {
      0%, 100% { opacity: 0.2; transform: scale(0.8); }
      50% { opacity: 0.95; transform: scale(1.3); }
    }

    @keyframes arrowPulse {
      0%, 100% { opacity: 0.4; transform: translateX(0); }
      50% { opacity: 1; transform: translateX(3px); }
    }

    .pulse-dot-1 {
      offset-path: path("M 85 90 L 915 90");
      animation: movePulse 3.6s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }

    .pulse-dot-2 {
      offset-path: path("M 85 90 L 915 90");
      animation: movePulse 3.6s cubic-bezier(0.4, 0, 0.2, 1) infinite 1.8s;
    }

    .ring-aura {
      transform-origin: 0px 0px;
      animation: pulseRing 3.6s ease-out infinite;
    }
    .r1 { animation-delay: 0s; }
    .r2 { animation-delay: 0.6s; }
    .r3 { animation-delay: 1.2s; }
    .r4 { animation-delay: 1.8s; }
    .r5 { animation-delay: 2.4s; }
    .r6 { animation-delay: 3.0s; }

    .final-node-pulse {
      transform-origin: 0px 0px;
      animation: finalNodePulse 3s ease-in-out infinite;
    }

    .flow-arrow {
      animation: arrowPulse 2s ease-in-out infinite;
    }
    .a1 { animation-delay: 0.2s; }
    .a2 { animation-delay: 0.6s; }
    .a3 { animation-delay: 1.0s; }
    .a4 { animation-delay: 1.4s; }
    .a5 { animation-delay: 1.8s; }

    .petal-f1 { animation: pipePetal 8s ease-in-out infinite; }
    .petal-f2 { animation: pipePetalRev 9s ease-in-out infinite 2s; }
    .petal-f3 { animation: pipePetal 8.5s ease-in-out infinite 4s; }
    .petal-f4 { animation: pipePetalRev 10s ease-in-out infinite 6s; }

    .star-bg { animation: starPulse 2.8s ease-in-out infinite; }

    .node-title {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.3px;
      text-anchor: middle;
      fill: #ffffff;
    }

    .node-sub {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 9.5px;
      font-weight: 600;
      text-anchor: middle;
      fill: #fda4af;
    }

    .node-detail {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 8.5px;
      font-weight: 500;
      text-anchor: middle;
      fill: #fbcfe8;
      opacity: 0.9;
    }

    .node-title-highlight {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 11.5px;
      font-weight: 800;
      letter-spacing: 0.4px;
      text-anchor: middle;
      fill: #ffffff;
    }

    .node-sub-highlight {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 10px;
      font-weight: 700;
      text-anchor: middle;
      fill: #fff0f3;
    }

    .node-detail-highlight {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 9px;
      font-weight: 600;
      text-anchor: middle;
      fill: #ffe4e6;
    }
  </style>

  <!-- Container Box -->
  <rect width="1000" height="180" rx="16" fill="url(#pipeBg)" stroke="#3d122b" stroke-width="1.5" />

  <!-- Twinkling Stardust covering 100% of pipeline background -->
  <g fill="#ffc2d1">
    <circle cx="50" cy="30" r="1.5" class="star-bg" style="animation-delay: 0.2s;" />
    <circle cx="170" cy="22" r="1.8" class="star-bg" style="animation-delay: 1.1s;" />
    <circle cx="330" cy="28" r="1.4" class="star-bg" style="animation-delay: 2.0s;" />
    <circle cx="500" cy="24" r="2.0" class="star-bg" style="animation-delay: 0.7s;" />
    <circle cx="670" cy="20" r="1.6" class="star-bg" style="animation-delay: 1.5s;" />
    <circle cx="830" cy="25" r="1.7" class="star-bg" style="animation-delay: 2.3s;" />
    <circle cx="960" cy="32" r="1.5" class="star-bg" style="animation-delay: 0.5s;" />

    <circle cx="60" cy="155" r="1.6" class="star-bg" style="animation-delay: 1.4s;" />
    <circle cx="210" cy="160" r="1.5" class="star-bg" style="animation-delay: 0.3s;" />
    <circle cx="380" cy="158" r="1.9" class="star-bg" style="animation-delay: 2.2s;" />
    <circle cx="540" cy="162" r="1.4" class="star-bg" style="animation-delay: 1.0s;" />
    <circle cx="710" cy="155" r="1.8" class="star-bg" style="animation-delay: 1.8s;" />
    <circle cx="880" cy="160" r="1.6" class="star-bg" style="animation-delay: 0.8s;" />
  </g>

  <!-- Floating Sakura Petals covering 100% across canvas -->
  <g fill="#ff758f">
    <g transform="translate(140, 20)">
      <path class="petal-f1" d="M 0 0 C 10 -3, 16 6, 10 12 C 4 16, -4 8, 0 0 Z" opacity="0.65" />
    </g>
    <g transform="translate(390, 145)">
      <path class="petal-f2" d="M 0 0 C 12 -4, 18 6, 10 14 C 3 18, -5 8, 0 0 Z" opacity="0.6" />
    </g>
    <g transform="translate(620, 20)">
      <path class="petal-f3" d="M 0 0 C 11 -3, 17 8, 11 14 C 4 18, -4 10, 0 0 Z" opacity="0.65" />
    </g>
    <g transform="translate(830, 145)">
      <path class="petal-f4" d="M 0 0 C 13 -4, 19 7, 12 15 C 4 19, -5 9, 0 0 Z" opacity="0.6" />
    </g>
  </g>

  <!-- Main Connecting Track Line (Base + Luminous Dashed Overlay) -->
  <line x1="85" y1="90" x2="915" y2="90" stroke="#4a1537" stroke-width="3" />
  <line x1="85" y1="90" x2="915" y2="90" stroke="url(#trackGrad)" stroke-width="2.5" stroke-dasharray="6 6" filter="url(#trackGlow)" />

  <!-- Flow Direction Arrows Between Nodes -->
  <g stroke="#ff758f" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path class="flow-arrow a1" d="M 165 85 L 171 90 L 165 95" />
    <path class="flow-arrow a2" d="M 331 85 L 337 90 L 331 95" />
    <path class="flow-arrow a3" d="M 497 85 L 503 90 L 497 95" />
    <path class="flow-arrow a4" d="M 663 85 L 669 90 L 663 95" />
    <path class="flow-arrow a5" d="M 829 85 L 835 90 L 829 95" />
  </g>

  <!-- Multiple Animated Light Pulses traveling down the track -->
  <circle cx="0" cy="0" r="5" fill="#ffffff" filter="url(#nodeGlow)" class="pulse-dot-1" />
  <circle cx="0" cy="0" r="4.5" fill="#ff758f" filter="url(#nodeGlow)" class="pulse-dot-2" />

  <!-- STEP 1: Cart Items -->
  <g transform="translate(85, 90)">
    <circle r="61" fill="none" stroke="#e63960" stroke-width="1.2" class="ring-aura r1" />
    <circle r="55" fill="#200719" stroke="#e63960" stroke-width="1.8" filter="url(#nodeGlow)" />
    <text y="-12" class="node-title">CART ITEMS</text>
    <text y="5" class="node-sub">Region Code</text>
    <text y="21" class="node-detail">16 Locales</text>
  </g>

  <!-- STEP 2: 16 Regions -->
  <g transform="translate(251, 90)">
    <circle r="61" fill="none" stroke="#e63960" stroke-width="1.2" class="ring-aura r2" />
    <circle r="55" fill="#200719" stroke="#e63960" stroke-width="1.8" filter="url(#nodeGlow)" />
    <text y="-12" class="node-title">16 REGIONS</text>
    <text y="5" class="node-sub">Price Matrix</text>
    <text y="21" class="node-detail">Local Currency</text>
  </g>

  <!-- STEP 3: Subtotal & Modifiers -->
  <g transform="translate(417, 90)">
    <circle r="61" fill="none" stroke="#e63960" stroke-width="1.2" class="ring-aura r3" />
    <circle r="55" fill="#200719" stroke="#e63960" stroke-width="1.8" filter="url(#nodeGlow)" />
    <text y="-12" class="node-title">SUBTOTAL</text>
    <text y="5" class="node-sub">Modifiers Delta</text>
    <text y="21" class="node-detail">Line Items Sum</text>
  </g>

  <!-- STEP 4: Statutory VAT -->
  <g transform="translate(583, 90)">
    <circle r="61" fill="none" stroke="#e63960" stroke-width="1.2" class="ring-aura r4" />
    <circle r="55" fill="#200719" stroke="#e63960" stroke-width="1.8" filter="url(#nodeGlow)" />
    <text y="-12" class="node-title">STATUTORY VAT</text>
    <text y="5" class="node-sub">Legal Rates</text>
    <text y="21" class="node-detail">8% – 25.5%</text>
  </g>

  <!-- STEP 5: Discounts -->
  <g transform="translate(749, 90)">
    <circle r="61" fill="none" stroke="#e63960" stroke-width="1.2" class="ring-aura r5" />
    <circle r="55" fill="#200719" stroke="#e63960" stroke-width="1.8" filter="url(#nodeGlow)" />
    <text y="-12" class="node-title">DISCOUNTS</text>
    <text y="5" class="node-sub">Tiers 3% – 15%</text>
    <text y="21" class="node-detail">+ Promo Codes</text>
  </g>

  <!-- STEP 6: Final Total (Active Highlight) -->
  <g transform="translate(915, 90)">
    <circle r="63" fill="none" stroke="#ff758f" stroke-width="1.6" class="ring-aura r6" />
    <g class="final-node-pulse">
      <circle r="56" fill="url(#activeNode)" stroke="#ffffff" stroke-width="2.2" filter="url(#pulseGlow)" />
      <text y="-12" class="node-title-highlight">FINAL TOTAL</text>
      <text y="5" class="node-sub-highlight">HALF_UP Round</text>
      <text y="21" class="node-detail-highlight">2 Decimals</text>
    </g>
  </g>
</svg>