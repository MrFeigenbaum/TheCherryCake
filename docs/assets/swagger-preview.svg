<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 390" width="100%" height="390">
  <defs>
    <linearGradient id="swgBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#190814" />
      <stop offset="50%" stop-color="#230b1c" />
      <stop offset="100%" stop-color="#14040f" />
    </linearGradient>

    <linearGradient id="swgBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e63960" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#ff758f" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#e63960" stop-opacity="0.8" />
    </linearGradient>

    <linearGradient id="laserLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e63960" stop-opacity="0" />
      <stop offset="50%" stop-color="#ff758f" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#e63960" stop-opacity="0" />
    </linearGradient>

    <filter id="swGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    @keyframes sweepGlow {
      0% { transform: translateY(0); opacity: 0; }
      10% { opacity: 0.6; }
      90% { opacity: 0.6; }
      100% { transform: translateY(340px); opacity: 0; }
    }
    @keyframes statusBlink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }
    .sweep-bar {
      animation: sweepGlow 5s ease-in-out infinite;
    }
    .status-dot {
      animation: statusBlink 2s ease-in-out infinite;
    }
    .mono-font {
      font-family: 'JetBrains Mono', 'Fira Code', Consolas, monospace;
    }
    .sans-font {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
  </style>

  <!-- Container Box -->
  <rect x="2" y="2" width="996" height="386" rx="16" fill="url(#swgBg)" stroke="url(#swgBorder)" stroke-width="1.5" />

  <!-- Scanning Laser Bar -->
  <g class="sweep-bar">
    <line x1="20" y1="45" x2="980" y2="45" stroke="url(#laserLine)" stroke-width="1.5" filter="url(#swGlow)" />
  </g>

  <!-- WINDOW TITLEBAR -->
  <path d="M 2 18 C 2 9, 9 2, 18 2 L 982 2 C 991 2, 998 9, 998 18 L 998 42 L 2 42 Z" fill="#2d0e24" />
  <line x1="2" y1="42" x2="998" y2="42" stroke="#3d152c" stroke-width="1" />

  <!-- Window Dots -->
  <circle cx="24" cy="22" r="5.5" fill="#ff5f56" />
  <circle cx="42" cy="22" r="5.5" fill="#ffbd2e" />
  <circle cx="60" cy="22" r="5.5" fill="#27c93f" />

  <!-- Title Badge -->
  <rect x="300" y="11" width="400" height="22" rx="11" fill="#1b0615" stroke="#4a1537" stroke-width="1" />
  <text x="500" y="26" class="mono-font" font-size="11.5" font-weight="600" fill="#fda4af" text-anchor="middle">
    SpringDoc OpenAPI 3.0 &#8226; Interactive Swagger UI (/v3/api-docs)
  </text>

  <!-- Live Status -->
  <g transform="translate(875, 16)">
    <circle cx="6" cy="6" r="3.5" fill="#38c172" class="status-dot" />
    <text x="16" y="10" class="sans-font" font-size="10" font-weight="700" fill="#38c172" letter-spacing="0.5">
      16 BRANCHES
    </text>
  </g>

  <!-- ENDPOINT 1: GET /api/v1/catalog/regions -->
  <g transform="translate(20, 54)">
    <rect width="960" height="56" rx="10" fill="#240c1e" stroke="#3b82f6" stroke-width="1" stroke-opacity="0.4" />
    <rect x="14" y="12" width="60" height="32" rx="6" fill="#1e3a8a" />
    <text x="44" y="32" class="mono-font" font-size="12" font-weight="800" fill="#93c5fd" text-anchor="middle">GET</text>
    <text x="90" y="32" class="mono-font" font-size="13" font-weight="700" fill="#ffffff">/api/v1/catalog/regions</text>
    <text x="320" y="32" class="sans-font" font-size="11.5" font-weight="400" fill="#c7a3b3">
      16 operating countries, local currencies, flagship hubs &amp; legal VAT rates
    </text>
    <rect x="855" y="16" width="90" height="24" rx="12" fill="#172554" stroke="#3b82f6" stroke-width="1" />
    <text x="900" y="32" class="mono-font" font-size="10.5" font-weight="700" fill="#93c5fd" text-anchor="middle">200 OK</text>
  </g>

  <!-- ENDPOINT 2: POST /api/v1/cart/calculate -->
  <g transform="translate(20, 118)">
    <rect width="960" height="56" rx="10" fill="#240c1e" stroke="#10b981" stroke-width="1" stroke-opacity="0.4" />
    <rect x="14" y="12" width="60" height="32" rx="6" fill="#064e3b" />
    <text x="44" y="32" class="mono-font" font-size="12" font-weight="800" fill="#6ee7b7" text-anchor="middle">POST</text>
    <text x="90" y="32" class="mono-font" font-size="13" font-weight="700" fill="#ffffff">/api/v1/cart/calculate</text>
    <text x="320" y="32" class="sans-font" font-size="11.5" font-weight="400" fill="#c7a3b3">
      Server-side BigDecimal calculation: subtotal, regional VAT &amp; discount tiers
    </text>
    <rect x="855" y="16" width="90" height="24" rx="12" fill="#064e3b" stroke="#10b981" stroke-width="1" />
    <text x="900" y="32" class="mono-font" font-size="10.5" font-weight="700" fill="#6ee7b7" text-anchor="middle">200 OK</text>
  </g>

  <!-- ENDPOINT 3: POST /api/v1/orders -->
  <g transform="translate(20, 182)">
    <rect width="960" height="56" rx="10" fill="#240c1e" stroke="#10b981" stroke-width="1" stroke-opacity="0.4" />
    <rect x="14" y="12" width="60" height="32" rx="6" fill="#064e3b" />
    <text x="44" y="32" class="mono-font" font-size="12" font-weight="800" fill="#6ee7b7" text-anchor="middle">POST</text>
    <text x="90" y="32" class="mono-font" font-size="13" font-weight="700" fill="#ffffff">/api/v1/orders</text>
    <text x="320" y="32" class="sans-font" font-size="11.5" font-weight="400" fill="#c7a3b3">
      Order submission with server price locking &amp; pickup/delivery validation
    </text>
    <rect x="850" y="16" width="96" height="24" rx="12" fill="#064e3b" stroke="#10b981" stroke-width="1" />
    <text x="898" y="32" class="mono-font" font-size="10" font-weight="700" fill="#6ee7b7" text-anchor="middle">201 CREATED</text>
  </g>

  <!-- ENDPOINT 4: POST /api/v1/bookings -->
  <g transform="translate(20, 246)">
    <rect width="960" height="56" rx="10" fill="#240c1e" stroke="#10b981" stroke-width="1" stroke-opacity="0.4" />
    <rect x="14" y="12" width="60" height="32" rx="6" fill="#064e3b" />
    <text x="44" y="32" class="mono-font" font-size="12" font-weight="800" fill="#6ee7b7" text-anchor="middle">POST</text>
    <text x="90" y="32" class="mono-font" font-size="13" font-weight="700" fill="#ffffff">/api/v1/bookings</text>
    <text x="320" y="32" class="sans-font" font-size="11.5" font-weight="400" fill="#c7a3b3">
      Table reservations with slot verification &amp; double-booking prevention
    </text>
    <rect x="850" y="16" width="96" height="24" rx="12" fill="#064e3b" stroke="#10b981" stroke-width="1" />
    <text x="898" y="32" class="mono-font" font-size="10" font-weight="700" fill="#6ee7b7" text-anchor="middle">201 CREATED</text>
  </g>

  <!-- ENDPOINT 5: GET /api/v1/reports/sales -->
  <g transform="translate(20, 310)">
    <rect width="960" height="56" rx="10" fill="#240c1e" stroke="#f59e0b" stroke-width="1" stroke-opacity="0.4" />
    <rect x="14" y="12" width="60" height="32" rx="6" fill="#1e3a8a" />
    <text x="44" y="32" class="mono-font" font-size="12" font-weight="800" fill="#93c5fd" text-anchor="middle">GET</text>
    <text x="90" y="32" class="mono-font" font-size="13" font-weight="700" fill="#ffffff">/api/v1/reports/sales</text>
    <text x="320" y="32" class="sans-font" font-size="11.5" font-weight="400" fill="#c7a3b3">
      Sales analytics with monthly revenue, CSV export &amp; formatted PDF
    </text>
    <rect x="850" y="16" width="96" height="24" rx="12" fill="#78350f" stroke="#f59e0b" stroke-width="1" />
    <text x="898" y="32" class="mono-font" font-size="10" font-weight="700" fill="#fde68a" text-anchor="middle">ROLE_ADMIN</text>
  </g>
</svg>