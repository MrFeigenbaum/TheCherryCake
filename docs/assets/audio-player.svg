<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1000 68" width="100%" height="68">
  <defs>
    <linearGradient id="audioBarBg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1f0918" stop-opacity="0.95" />
      <stop offset="50%" stop-color="#2a0d22" stop-opacity="0.98" />
      <stop offset="100%" stop-color="#1f0918" stop-opacity="0.95" />
    </linearGradient>

    <linearGradient id="audioBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e63960" stop-opacity="0.4" />
      <stop offset="50%" stop-color="#ff758f" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#e63960" stop-opacity="0.4" />
    </linearGradient>

    <filter id="aGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    @keyframes discSpin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes eq1 { 0%, 100% { height: 4px; y: 40px; } 50% { height: 14px; y: 30px; } }
    @keyframes eq2 { 0%, 100% { height: 14px; y: 30px; } 50% { height: 6px; y: 38px; } }
    @keyframes eq3 { 0%, 100% { height: 8px; y: 36px; } 50% { height: 16px; y: 28px; } }
    @keyframes eq4 { 0%, 100% { height: 12px; y: 32px; } 50% { height: 5px; y: 39px; } }

    .disc-spin {
      transform-origin: 40px 34px;
      animation: discSpin 6s linear infinite;
    }
    .bar-1 { animation: eq1 0.8s ease-in-out infinite; }
    .bar-2 { animation: eq2 0.7s ease-in-out infinite 0.15s; }
    .bar-3 { animation: eq3 0.9s ease-in-out infinite 0.3s; }
    .bar-4 { animation: eq4 0.75s ease-in-out infinite 0.1s; }
  </style>

  <!-- Container Box -->
  <rect x="2" y="2" width="996" height="64" rx="32" fill="url(#audioBarBg)" stroke="url(#audioBorder)" stroke-width="1.2" />

  <!-- LEFT: Disc with Official Logo Flower &amp; Track Info -->
  <g class="disc-spin">
    <circle cx="40" cy="34" r="18" fill="#14040f" stroke="#e63960" stroke-width="1.5" />
    <circle cx="40" cy="34" r="13" fill="#2d0e24" />
    <image x="28" y="22" width="24" height="24" href="data:image/png;base64," />
  </g>

  <!-- Track Title -->
  <text x="72" y="30" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700" fill="#ffffff">
    Rio - Fly Love
  </text>
  <text x="72" y="46" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="500" fill="#c7a3b3">
    Ambient Café Confectionery Soundtrack &#8226; 12 Handcrafted Ambient Tracks
  </text>

  <!-- Equalizer -->
  <g fill="#ff758f">
    <rect x="180" y="32" width="2.5" height="10" rx="1.2" class="bar-1" />
    <rect x="185" y="30" width="2.5" height="14" rx="1.2" class="bar-2" />
    <rect x="190" y="34" width="2.5" height="8" rx="1.2" class="bar-3" />
    <rect x="195" y="31" width="2.5" height="12" rx="1.2" class="bar-4" />
  </g>

  <!-- CENTER: Audio Controls -->
  <g transform="translate(470, 22)">
    <path d="M 0 6 L 8 0 L 8 12 Z M 0 0 L 0 12" stroke="#fda4af" stroke-width="1.5" fill="#fda4af" />
    <circle cx="30" cy="12" r="16" fill="#e63960" filter="url(#aGlow)" />
    <rect x="26" y="7" width="3" height="10" rx="1" fill="#ffffff" />
    <rect x="31" y="7" width="3" height="10" rx="1" fill="#ffffff" />
    <path d="M 52 0 L 60 6 L 52 12 Z M 60 0 L 60 12" stroke="#fda4af" stroke-width="1.5" fill="#fda4af" />
  </g>

  <!-- RIGHT: Volume Control Mockup -->
  <g transform="translate(820, 26)">
    <path d="M 0 8 L 5 8 L 10 3 L 10 17 L 5 12 L 0 12 Z" fill="#fda4af" />
    <path d="M 13 6 C 15 8, 15 12, 13 14" stroke="#fda4af" stroke-width="1.5" fill="none" stroke-linecap="round" />
    <rect x="22" y="8" width="120" height="4" rx="2" fill="#38132d" />
    <rect x="22" y="8" width="65" height="4" rx="2" fill="#e63960" />
    <circle cx="87" cy="10" r="5" fill="#ffffff" filter="url(#aGlow)" />
  </g>
</svg>